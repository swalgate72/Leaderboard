<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaderboard – Live Scores</title>
  <meta name="description" content="Live golf leaderboard">
  <style>
    :root {
      --bg:          #0f1923;
      --surface:     #1a2535;
      --surface2:    #243045;
      --gold:        #d4a843;
      --gold-border: rgba(212,168,67,0.35);
      --text:        #f0f4f8;
      --muted:       #a0aec0;
      --green:       #48bb78;
      --red:         #e53e3e;
      --radius:      0.75rem;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100dvh;
      padding: 0 0 2rem;
    }

    /* ── Header ── */
    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--gold-border);
      padding: 1rem 1.25rem 0.85rem;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: #fff;
      line-height: 1.2;
      margin-bottom: 0.15rem;
    }
    .header-format {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 0.2rem;
    }
    .header-meta {
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 0.75rem;
    }
    .header-btns {
      display: flex;
      gap: 0.5rem;
    }
    .refresh-btn {
      background: none;
      border: 1px solid var(--gold-border);
      color: var(--gold);
      border-radius: 0.5rem;
      padding: 0.35rem 0.7rem;
      font-size: 0.8rem;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .refresh-btn:active { opacity: 0.6; }

    /* ── Status bar ── */
    .status-bar {
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted);
      padding: 0.4rem 1rem;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .status-bar .dot {
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--green);
      margin-right: 0.35rem;
      vertical-align: middle;
      animation: pulse 2s infinite;
    }
    .status-bar.stale .dot { background: var(--muted); animation: none; }
    @keyframes pulse {
      0%,100% { opacity: 1; } 50% { opacity: 0.3; }
    }

    /* ── Code entry ── */
    .code-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 70dvh;
      padding: 2rem;
      gap: 1.25rem;
      text-align: center;
    }
    .code-screen h2 { font-size: 1.2rem; }
    .code-screen p  { font-size: 0.9rem; color: var(--muted); max-width: 280px; line-height: 1.5; }
    .code-input {
      background: var(--surface);
      border: 1px solid var(--gold-border);
      border-radius: 0.6rem;
      color: var(--text);
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.25em;
      padding: 0.7rem 1.25rem;
      text-align: center;
      text-transform: uppercase;
      width: 220px;
      outline: none;
    }
    .code-input::placeholder { color: var(--muted); font-weight: 400; letter-spacing: 0; font-size: 1rem; }
    .code-input:focus { border-color: var(--gold); }
    .btn-go {
      background: var(--gold);
      color: #000;
      font-weight: 700;
      border: none;
      border-radius: 0.6rem;
      padding: 0.7rem 2rem;
      font-size: 1rem;
      cursor: pointer;
      width: 220px;
    }
    .btn-go:disabled { opacity: 0.4; cursor: default; }

    /* ── Error / empty states ── */
    .state-msg {
      text-align: center;
      padding: 3rem 2rem;
      color: var(--muted);
    }
    .state-msg .icon { font-size: 2rem; margin-bottom: 0.75rem; }
    .state-msg h3    { color: var(--text); margin-bottom: 0.5rem; }

    /* ── Round tabs ── */
    .round-tabs {
      display: flex;
      gap: 0.4rem;
      padding: 0.75rem 1rem 0;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .round-tabs::-webkit-scrollbar { display: none; }
    .round-tab {
      background: var(--surface);
      border: 1px solid var(--gold-border);
      color: var(--muted);
      border-radius: 2rem;
      padding: 0.3rem 0.9rem;
      font-size: 0.82rem;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .round-tab.active {
      background: var(--gold);
      color: #000;
      font-weight: 700;
      border-color: transparent;
    }

    /* ── Leaderboard table ── */
    .lb-wrap { padding: 0.75rem 1rem; }

    .lb-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
    }
    .lb-table thead th {
      text-align: left;
      color: var(--muted);
      font-weight: 600;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.4rem 0.5rem;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .lb-table thead th.num { text-align: center; }

    .lb-table tbody tr {
      border-bottom: 1px solid rgba(255,255,255,0.05);
      transition: background 0.15s;
    }
    .lb-table tbody tr:last-child { border-bottom: none; }
    .lb-table tbody tr:hover { background: rgba(255,255,255,0.03); }

    .lb-table td {
      padding: 0.65rem 0.5rem;
      vertical-align: middle;
    }
    .lb-table td.num { text-align: center; }

    .pos {
      color: var(--muted);
      font-size: 0.8rem;
      min-width: 1.5rem;
    }
    .pos.top3 { color: var(--gold); font-weight: 700; }

    .player-name {
      font-weight: 600;
    }
    .player-hcp {
      font-size: 0.75rem;
      color: var(--muted);
    }

    .score-pill {
      display: inline-block;
      min-width: 2rem;
      text-align: center;
      font-weight: 700;
      border-radius: 0.3rem;
      padding: 0.1rem 0.35rem;
    }
    .score-pill.plus  { background: rgba(72,187,120,0.18); color: var(--green); }
    .score-pill.zero  { background: rgba(212,168,67,0.18);  color: var(--gold); }
    .score-pill.minus { background: rgba(229,62,62,0.18);   color: var(--red); }

    .total-pts {
      font-weight: 700;
      font-size: 1rem;
    }

    /* Stableford: higher = better; stroke: lower = better */
    .rank-1 { color: var(--gold); }

    /* ── Scorecard rows (expandable) ── */
    .sc-row { display: none; }
    .sc-row.open { display: table-row; }
    .sc-cell {
      padding: 0.5rem 0.5rem 0.75rem;
      background: var(--surface2);
    }
    .sc-holes {
      display: flex;
      flex-wrap: wrap;
      gap: 0.25rem;
    }
    .sc-hole {
      width: 2.2rem;
      text-align: center;
      font-size: 0.7rem;
      background: var(--surface);
      border-radius: 0.3rem;
      padding: 0.2rem 0;
    }
    .sc-hole .h-num { color: var(--muted); font-size: 0.65rem; }
    .sc-hole .h-pts { font-weight: 700; }

    /* ── Auto-refresh countdown ── */
    #countdown { font-variant-numeric: tabular-nums; }

    @media (min-width: 600px) {
      .lb-wrap { max-width: 680px; margin: 0 auto; }
      .round-tabs  { max-width: 680px; margin: 0 auto; }
    }
  </style>
</head>
<body>

<header class="header" id="hdr" style="display:none">
  <div class="header-title" id="hdr-title">Leaderboard</div>
  <div class="header-format" id="hdr-format"></div>
  <div class="header-meta" id="hdr-meta"></div>
  <div class="header-btns">
    <button class="refresh-btn" id="btn-copy-link" onclick="copyLink()">⎘ Copy URL</button>
    <button class="refresh-btn" id="btn-refresh">↻ Refresh</button>
  </div>
</header>

<div class="status-bar stale" id="status-bar" style="display:none">
  <span class="dot"></span>
  Updated <span id="last-updated">–</span> · auto-refresh in <span id="countdown">60</span>s
</div>

<main id="main">
  <!-- Code entry screen shown when no ?code= param -->
  <div class="code-screen" id="screen-code">
    <div style="font-size:2.5rem">⛳</div>
    <h2>Live Leaderboard</h2>
    <p>Enter the game code to view scores</p>
    <input class="code-input" id="code-input" maxlength="6" placeholder="e.g. X7K2AB" autocomplete="off" spellcheck="false">
    <button class="btn-go" id="btn-go" disabled>View Scores</button>
  </div>
</main>

<script>
// ── Config ────────────────────────────────────────────────────────────────────
// SYNC_WORKER_URL is injected at deploy time; falls back to a placeholder
const WORKER = (window.LEADERBOARD_WORKER_URL || 'https://leaderboardsync.sw-77d.workers.dev').replace(/\/$/, '');
const REFRESH_SECS = 60;

// ── State ─────────────────────────────────────────────────────────────────────
let currentCode   = null;
let gameData      = null;
let scoresData    = null;
let activeRound   = null;
let refreshTimer  = null;
let countdownVal  = REFRESH_SECS;

// ── Copy link ─────────────────────────────────────────────────────────────────
function copyLink() {
  const url = location.href;
  const btn = document.getElementById('btn-copy-link');
  navigator.clipboard.writeText(url).then(() => {
    const orig = btn.textContent;
    btn.textContent = '✓ Copied!';
    btn.style.color = '#48bb78';
    setTimeout(() => { btn.textContent = orig; btn.style.color = ''; }, 2000);
  }).catch(() => {
    // Fallback: select a temporary input
    const inp = document.createElement('input');
    inp.value = url;
    inp.style.cssText = 'position:fixed;opacity:0;top:0;left:0;';
    document.body.appendChild(inp);
    inp.focus(); inp.select();
    document.execCommand('copy');
    document.body.removeChild(inp);
    const orig = btn.textContent;
    btn.textContent = '✓ Copied!';
    btn.style.color = '#48bb78';
    setTimeout(() => { btn.textContent = orig; btn.style.color = ''; }, 2000);
  });
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function qs(sel, ctx = document) { return ctx.querySelector(sel); }

function fmtRelTime(isoStr) {
  if (!isoStr) return '–';
  const diff = Math.floor((Date.now() - new Date(isoStr).getTime()) / 1000);
  if (diff < 5)   return 'just now';
  if (diff < 60)  return `${diff}s ago`;
  if (diff < 3600) return `${Math.floor(diff/60)}m ago`;
  return `${Math.floor(diff/3600)}h ago`;
}

function fmtScore(pts, fmt) {
  if (pts == null) return '<span class="score-pill" style="color:var(--muted)">–</span>';
  const n = Number(pts);
  if (fmt === 'stroke') {
    // lower is better — show relative to par if available
    const cls = n < 0 ? 'plus' : n > 0 ? 'minus' : 'zero';
    const label = n === 0 ? 'E' : n > 0 ? `+${n}` : `${n}`;
    return `<span class="score-pill ${cls}">${label}</span>`;
  }
  // Stableford — higher is better
  const cls = n > 18 ? 'plus' : n < 18 ? 'minus' : 'zero';
  return `<span class="score-pill ${cls}">${n}</span>`;
}

// ── URL param handling ────────────────────────────────────────────────────────
function getCodeFromURL() {
  const p = new URLSearchParams(location.search);
  return (p.get('code') || '').toUpperCase().slice(0, 6);
}

function setCodeInURL(code) {
  const u = new URL(location.href);
  u.searchParams.set('code', code);
  history.replaceState(null, '', u.toString());
}

// ── Fetch from worker ─────────────────────────────────────────────────────────
async function fetchGame(code) {
  const r = await fetch(`${WORKER}/game/${code}`);
  if (r.ok) return r.json();
  if (r.status !== 404) throw new Error(`Error ${r.status}`);
  // Not a regular game — try hub tournament endpoint
  const t = await fetch(`${WORKER}/tournament/${code}`);
  if (t.ok) {
    const d = await t.json();
    // Build a game-compatible object from tournament metadata
    return {
      name: d.name ?? code,
      organiser: d.organiser ?? null,
      createdAt: d.createdAt ?? null,
      format: { type: d.format ?? 'stableford' },
      players: [],
      _isTournament: true,
      _tournamentData: d,
    };
  }
  throw new Error('Game not found');
}

async function fetchScores(code) {
  const r = await fetch(`${WORKER}/scores/${code}`);
  if (r.status === 404) return null; // no scores yet — that's fine
  if (!r.ok) throw new Error(`Scores error ${r.status}`);
  return r.json();
}

// ── Render helpers ────────────────────────────────────────────────────────────
function showError(icon, title, msg) {
  qs('#main').innerHTML = `
    <div class="state-msg">
      <div class="icon">${icon}</div>
      <h3>${title}</h3>
      <p>${msg}</p>
    </div>`;
}


function renderRoundTabs(rounds, active, isTournament) {
  // In tournament mode always show the Total tab, even with a single round of data
  if (!isTournament && (!rounds || rounds.length <= 1)) return '';
  if (!rounds || !rounds.length) return '';
  return `
    <div class="round-tabs" id="round-tabs">
      <button class="round-tab${active === 'total' ? ' active' : ''}" data-round="total"
        style="${active === 'total' ? '' : 'border-color:rgba(212,168,67,0.4);color:var(--gold);'}">
        🏆 Total
      </button>
      ${rounds.map(r => `
        <button class="round-tab${r === active ? ' active' : ''}" data-round="${r}">
          R${r}
        </button>`).join('')}
    </div>`;
}

// ── Tournament total: sum pts/nets across all rounds per player ───────────────
function renderTournamentTotal(game, scores) {
  const fmt      = game.format?.type ?? 'stableford';
  const isStroke = fmt === 'stroke';
  const totalRoundsExpected = game._tournamentData?.totalRounds ?? null;

  if (!scores?.rounds?.length) {
    return `<div class="state-msg"><div class="icon">📋</div><h3>No scores yet</h3>
      <p>Push scores from the app to see the tournament leaderboard</p></div>`;
  }

  const roundNums = [...new Set(scores.rounds.map(r => r.round ?? 1))].sort((a,b)=>a-b);
  const numRounds = roundNums.length;

  // Group all player records by name, accumulate totals and per-round scores
  const byName = {};
  for (const grp of scores.rounds) {
    const rn = grp.round ?? 1;
    for (const p of (grp.players ?? [])) {
      const nm = p.name;
      if (!nm) continue;
      if (!byName[nm]) byName[nm] = { name: nm, hcp: p.hcp ?? 0, pts: 0, grossTotal: 0, netTotal: 0, roundMap: {} };
      const pts = p.pts ?? 0;
      const hp  = p.holesPlayed ?? 18;
      byName[nm].pts        += pts;
      byName[nm].grossTotal += p.grossTotal ?? 0;
      byName[nm].netTotal   += p.netTotal   ?? 0;
      byName[nm].roundMap[rn] = { pts, holesPlayed: hp };
    }
  }

  const players = Object.values(byName);
  if (!players.length) {
    return `<div class="state-msg"><div class="icon">📋</div><h3>No scores yet</h3></div>`;
  }

  // Sort: stroke = lowest net; others = highest pts
  players.sort((a, b) => isStroke
    ? (a.netTotal ?? Infinity) - (b.netTotal ?? Infinity)
    : (b.pts ?? -Infinity) - (a.pts ?? -Infinity));

  // Assign positions (tied players share rank)
  players.forEach((p, i) => {
    if (i > 0 && (isStroke ? p.netTotal === players[i-1].netTotal : p.pts === players[i-1].pts)) {
      p._pos = players[i-1]._pos;
    } else {
      p._pos = i + 1;
    }
  });

  // Show per-round columns when there are multiple rounds of data
  const showRoundCols = numRounds > 1;
  const hdrTotal = isStroke ? 'Net' : 'Tot';

  // Latest round number (for "thru" annotation on in-progress rounds)
  const latestRound = roundNums[roundNums.length - 1];

  const roundHdrs = showRoundCols
    ? roundNums.map(r => `<th class="num" style="font-size:0.65rem;color:var(--muted);">R${r}</th>`).join('') +
      `<th class="num" style="font-size:0.7rem;">${hdrTotal}</th>`
    : `<th class="num" style="font-size:0.7rem;">${hdrTotal}</th>`;

  const rows = players.map(p => {
    const posLabel = p._pos <= 3 ? ['🥇','🥈','🥉'][p._pos-1] : p._pos;
    const posClass = p._pos <= 3 ? 'pos top3' : 'pos';
    const total    = isStroke ? (p.netTotal ?? '–') : (p.pts ?? '–');

    // For the latest round, show "thru N" if not complete
    const latestEntry = p.roundMap[latestRound];
    const latestHoles = latestEntry?.holesPlayed ?? 18;
    const thruNote = latestHoles < 18
      ? ` <span style="font-size:0.7rem;color:var(--muted)">(thru ${latestHoles})</span>` : '';

    const sub = `HCP ${p.hcp ?? '–'}`;

    const roundCells = showRoundCols
      ? roundNums.map(r => {
          const rd = p.roundMap[r];
          const isLatest = r === latestRound;
          const style = isLatest ? 'color:#3b82f6;font-weight:700;' : 'color:var(--muted);';
          return `<td class="num" style="font-size:0.85rem;${style}">${rd ? rd.pts : '–'}</td>`;
        }).join('') +
        `<td class="num" style="font-weight:800;font-size:1.05rem;">${total}</td>`
      : `<td class="num" style="font-weight:800;font-size:1.05rem;">${total}${thruNote}</td>`;

    return `<tr>
      <td class="${posClass}">${posLabel}</td>
      <td>
        <div class="player-name">${p.name}${showRoundCols ? '' : thruNote}</div>
        <div class="player-hcp">${sub}</div>
      </td>
      ${roundCells}
    </tr>`;
  }).join('');

  const liveRoundNote = showRoundCols
    ? `<p style="text-align:center;color:#3b82f6;font-size:0.72rem;margin:0 0 0.5rem;">R${latestRound} (current round) shown in blue</p>`
    : '';

  return `
    <div style="text-align:center;padding:0.4rem 0 0.2rem;font-size:0.78rem;color:var(--muted);">
      Tournament total · ${numRounds} of ${totalRoundsExpected ?? numRounds} round${(totalRoundsExpected ?? numRounds) !== 1 ? 's' : ''} played
    </div>
    ${liveRoundNote}
    <div class="lb-wrap">
      <table class="lb-table">
        <thead>
          <tr>
            <th style="width:2rem">#</th>
            <th>Player</th>
            ${roundHdrs}
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

function renderLeaderboard(game, scores, round) {
  const fmt = game.format?.type ?? 'stableford';

  // Gather groups (each group is an array of players) for this round
  let groups = [];
  if (scores && scores.rounds) {
    const roundData = scores.rounds.filter(r => r.round === round);
    for (const grp of roundData) {
      if (grp.players?.length) groups.push(grp.players.map(p => ({ ...p, _group: grp.group })));
    }
  }

  // Fall back to game player list with no scores
  if (groups.length === 0 && game.players?.length) {
    groups = [game.players.map(p => ({ name: p.name, hcp: p.courseHcp ?? p.index ?? 0, total: null, scores: [] }))];
  }

  const allPlayers = groups.flat();

  if (allPlayers.length === 0) {
    return `<div class="state-msg">
      <div class="icon">📋</div>
      <h3>No scores yet</h3>
      <p>Scores will appear here once a group uploads their round</p>
    </div>`;
  }

  const dash = '<span style="color:var(--muted)">–</span>';

  // ── Helper: expandable scorecard row ──────────────────────────────
  function scRow(p, rowId, colSpan, holeScores) {
    if (!holeScores?.length) return '';
    const holes = holeScores.map((s, h) => `
      <div class="sc-hole">
        <div class="h-num">${h+1}</div>
        <div class="h-pts">${s ?? '–'}</div>
      </div>`).join('');
    return `<tr class="sc-row" id="${rowId}">
      <td class="sc-cell" colspan="${colSpan}"><div class="sc-holes">${holes}</div></td>
    </tr>`;
  }

  // ── MATCH PLAY ─────────────────────────────────────────────────────
  // Players are paired in the order they appear within each group
  if (fmt === 'match' || fmt === 'foursomes' || fmt === 'greensomes') {
    let html = '';
    for (const grp of groups) {
      // pairs: [p0,p1], [p2,p3], …
      for (let i = 0; i < grp.length; i += 2) {
        const p0 = grp[i], p1 = grp[i+1];
        if (!p0) continue;
        if (!p1) {
          // odd player out — just show them
          html += `<div class="lb-wrap" style="padding-bottom:0.25rem;">
            <table class="lb-table"><tbody>
              <tr><td>${p0.name ?? '?'}</td><td class="num">${p0.grossTotal ?? dash}</td></tr>
            </tbody></table></div>`;
          continue;
        }
        // Compute match status from hole-by-hole nets
        const nets0 = p0.nets ?? p0.scores ?? [];
        const nets1 = p1.nets ?? p1.scores ?? [];
        const holesPlayed = Math.min(nets0.length, nets1.length);
        let matchScore = 0; // positive = p0 leads
        let holesRemaining = (game.format?.holesCount ?? 18) - holesPlayed;
        for (let h = 0; h < holesPlayed; h++) {
          const n0 = nets0[h] ?? 99, n1 = nets1[h] ?? 99;
          if (n0 < n1) matchScore++;
          else if (n1 < n0) matchScore--;
        }
        const up = Math.abs(matchScore);
        let statusText;
        if (holesPlayed === 0) {
          statusText = 'Not started';
        } else if (holesPlayed >= (game.format?.holesCount ?? 18) || up > holesRemaining) {
          // finished or mathematically decided
          if (matchScore === 0) statusText = 'Halved';
          else {
            const winner = matchScore > 0 ? p0.name : p1.name;
            const holesLeft = holesRemaining > 0 ? `&${holesRemaining}` : '';
            statusText = holesRemaining > 0
              ? `${up}&${holesRemaining}` // e.g. 3&2
              : `${up} Up`; // finished on last hole
          }
        } else if (matchScore === 0) {
          statusText = 'All Square';
        } else {
          const leader = matchScore > 0 ? p0.name : p1.name;
          statusText = `${up} Up (${leader.split(' ')[0]})`;
        }

        const statusColor = matchScore === 0 ? 'var(--gold)' : 'var(--green)';
        html += `
          <div class="lb-wrap" style="padding-bottom:0;">
            <div style="border:1px solid rgba(255,255,255,0.1);border-radius:0.75rem;overflow:hidden;margin-bottom:0.75rem;">
              <div style="display:flex;align-items:center;justify-content:space-between;
                          padding:0.5rem 0.75rem;background:rgba(255,255,255,0.04);
                          border-bottom:1px solid rgba(255,255,255,0.07);">
                <span style="font-size:0.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;">Match</span>
                <span style="font-size:0.8rem;font-weight:700;color:${statusColor};">${statusText}</span>
                <span style="font-size:0.72rem;color:var(--muted);">Thru ${holesPlayed}</span>
              </div>
              <table class="lb-table" style="margin:0;">
                <thead><tr>
                  <th>Player</th>
                  <th class="num" style="font-size:0.7rem">Shots</th>
                </tr></thead>
                <tbody>
                  <tr>
                    <td><div class="player-name">${p0.name ?? '?'}</div><div class="player-hcp">HCP ${p0.hcp ?? '–'}</div></td>
                    <td class="num" style="font-weight:700">${p0.grossTotal ?? (p0.scores?.reduce((s,v)=>s+(v??0),0)||null) ?? dash}</td>
                  </tr>
                  <tr style="border-top:1px solid rgba(255,255,255,0.08)">
                    <td><div class="player-name">${p1.name ?? '?'}</div><div class="player-hcp">HCP ${p1.hcp ?? '–'}</div></td>
                    <td class="num" style="font-weight:700">${p1.grossTotal ?? (p1.scores?.reduce((s,v)=>s+(v??0),0)||null) ?? dash}</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>`;
      }
    }
    return html || `<div class="state-msg"><div class="icon">📋</div><h3>No scores yet</h3></div>`;
  }

  // ── BETTER BALL / CSM (pairs showing team points) ─────────────────
  if (fmt === 'betterball' || fmt === 'csm') {
    let html = '';
    let pairIdx = 0;
    for (const grp of groups) {
      for (let i = 0; i < grp.length; i += 2) {
        const p0 = grp[i], p1 = grp[i+1];
        const teamPts = (p0?.pts ?? 0) + (p1?.pts ?? 0); // sum of individual best-ball pts
        const thru = Math.max(p0?.scores?.length ?? 0, p1?.scores?.length ?? 0);
        const pairLabel = fmt === 'csm' ? 'Combined' : 'Better Ball';
        html += `
          <div class="lb-wrap" style="padding-bottom:0;">
            <div style="border:1px solid rgba(255,255,255,0.1);border-radius:0.75rem;overflow:hidden;margin-bottom:0.75rem;">
              <table class="lb-table" style="margin:0;">
                <thead><tr>
                  <th>Player</th>
                  <th class="num" style="font-size:0.7rem">Shots</th>
                  <th class="num" style="font-size:0.7rem">Pts</th>
                </tr></thead>
                <tbody>
                  ${[p0, p1].filter(Boolean).map(p => `
                    <tr>
                      <td><div class="player-name">${p.name ?? '?'}</div><div class="player-hcp">HCP ${p.hcp ?? '–'}${p.scores?.length ? ` · Thru ${p.scores.length}` : ''}</div></td>
                      <td class="num">${p.grossTotal ?? (p.scores?.reduce((s,v)=>s+(v??0),0)||null) ?? dash}</td>
                      <td class="num" style="font-weight:700">${p.pts ?? dash}</td>
                    </tr>`).join('')}
                  <tr style="border-top:2px solid rgba(255,255,255,0.12);background:rgba(212,168,67,0.06);">
                    <td style="font-weight:700;font-size:0.85rem;color:var(--gold);">${pairLabel} Total</td>
                    <td></td>
                    <td class="num" style="font-weight:800;color:var(--gold);font-size:1rem;">${teamPts}</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>`;
        pairIdx++;
      }
    }
    return html || `<div class="state-msg"><div class="icon">📋</div><h3>No scores yet</h3></div>`;
  }

  // ── SCRAMBLE / TEXAS ───────────────────────────────────────────────
  if (fmt === 'texas') {
    let html = '';
    for (const grp of groups) {
      // Scramble: all players in the group contribute — show team score
      const teamScore = grp[0]?.total ?? null;
      const thru = grp[0]?.scores?.length ?? 0;
      const teamName = grp.map(p => p.name?.split(' ')[0]).join(' & ');
      html += `
        <div class="lb-wrap" style="padding-bottom:0;">
          <div style="border:1px solid rgba(255,255,255,0.1);border-radius:0.75rem;overflow:hidden;margin-bottom:0.75rem;">
            <table class="lb-table" style="margin:0;">
              <thead><tr>
                <th>Team</th>
                <th class="num" style="font-size:0.7rem">Shots</th>
                <th class="num" style="font-size:0.7rem">Pts</th>
              </tr></thead>
              <tbody>
                <tr>
                  <td>
                    <div class="player-name">${teamName}</div>
                    <div class="player-hcp">${thru > 0 ? `Thru ${thru}` : 'Not started'}</div>
                  </td>
                  <td class="num">${grp[0]?.grossTotal ?? dash}</td>
                  <td class="num" style="font-weight:800;color:var(--gold);font-size:1rem;">${teamScore ?? dash}</td>
                </tr>
                ${grp.map(p => `
                  <tr style="background:rgba(255,255,255,0.02);">
                    <td style="padding-left:1.25rem;">
                      <div style="font-size:0.82rem;color:var(--muted);">${p.name ?? '?'}</div>
                    </td>
                    <td class="num" style="font-size:0.82rem;color:var(--muted);">${p.grossTotal ?? dash}</td>
                    <td></td>
                  </tr>`).join('')}
              </tbody>
            </table>
          </div>
        </div>`;
    }
    return html || `<div class="state-msg"><div class="icon">📋</div><h3>No scores yet</h3></div>`;
  }

  // ── INDIVIDUAL FORMATS: Stableford, Stroke, Skins, ITC, Split 6 ───
  const isStroke = fmt === 'stroke';
  const isITC    = fmt === 'itc';
  const isSkins  = fmt === 'skins';

  // Columns: always Shots. Then format-specific:
  // stroke  → Net Shots (running net)
  // others  → Points
  // ITC     → Points + Chair count (shown in sub-label for now)
  const showNet  = isStroke;
  const showPts  = !isStroke;

  // Sort
  const sorted = [...allPlayers].sort((a, b) => {
    const ta = a.total ?? (isStroke ? Infinity : -Infinity);
    const tb = b.total ?? (isStroke ? Infinity : -Infinity);
    return isStroke ? ta - tb : tb - ta;
  });

  // Assign positions (handle ties)
  let pos = 1;
  sorted.forEach((p, i) => {
    if (i > 0 && p.total === sorted[i-1].total) {
      p._pos = sorted[i-1]._pos;
    } else {
      p._pos = pos;
    }
    pos = i + 2;
  });

  const colCount = showNet ? 3 : 3; // #, Name, Shots, Net/Pts
  const colSpan  = colCount + 1;

  const rows = sorted.map((p, i) => {
    const posLabel = p.total == null ? '–' : p._pos <= 3 ? ['🥇','🥈','🥉'][p._pos-1] : p._pos;
    const posClass = p._pos <= 3 && p.total != null ? 'pos top3' : 'pos';
    const rowId    = `sc-${i}`;

    const shots = p.grossTotal ?? (p.scores?.reduce((s,v)=>s+(v??0),0) || null);
    const net   = p.netTotal   ?? null;
    const pts   = p.pts        ?? (!isStroke ? p.total : null);
    const thru  = p.scores?.length ?? 0;

    const shotsCell = `<td class="num" style="font-size:0.9rem">${shots ?? dash}</td>`;
    const netCell   = showNet  ? `<td class="num" style="font-size:0.9rem;color:var(--gold);font-weight:700">${net ?? dash}</td>` : '';
    const ptsCell   = showPts  ? `<td class="num" style="font-size:0.9rem;font-weight:700">${pts ?? dash}</td>` : '';

    const itcSub = isITC && p.chairCount != null ? ` · 🪑 ×${p.chairCount}` : '';

    return `
      <tr style="cursor:${thru > 0 ? 'pointer' : 'default'}"
          onclick="${thru > 0 ? `toggleSC('${rowId}')` : ''}">
        <td class="${posClass}">${posLabel}</td>
        <td>
          <div class="player-name">${p.name ?? '?'}</div>
          <div class="player-hcp">HCP ${p.hcp ?? '–'}${thru > 0 ? ` · Thru ${thru}` : ''}${itcSub}</div>
        </td>
        ${shotsCell}${netCell}${ptsCell}
      </tr>
      ${scRow(p, rowId, colSpan, isStroke ? p.nets : p.scores)}`;
  }).join('');

  const hdrNet  = isStroke ? '<th class="num" style="font-size:0.7rem">Net</th>' : '';
  const hdrPts  = !isStroke ? `<th class="num" style="font-size:0.7rem">${isSkins ? 'Skins' : isITC ? 'Pts' : 'Pts'}</th>` : '';

  return `
    <div class="lb-wrap">
      <table class="lb-table">
        <thead>
          <tr>
            <th style="width:2rem">#</th>
            <th>Player</th>
            <th class="num" style="font-size:0.7rem">Shots</th>
            ${hdrNet}${hdrPts}
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
      ${sorted.some(p => (p.scores?.length ?? 0) > 0) ? '<p style="text-align:center;color:var(--muted);font-size:0.75rem;margin-top:0.75rem">Tap a row to see scorecard</p>' : ''}
    </div>`;
}

function toggleSC(id) {
  const row = document.getElementById(id);
  if (row) row.classList.toggle('open');
}
window.toggleSC = toggleSC;

// ── Main render ───────────────────────────────────────────────────────────────
function render() {
  if (!gameData) return;

  const game   = gameData;
  const scores = scoresData;

  // Work out available rounds
  const rounds = scores
    ? [...new Set(scores.rounds.map(r => r.round))].sort((a,b) => a-b)
    : [1];

  const isTournament = !!game._isTournament;

  // Default to "Total" tab for tournaments (always) or multi-round non-tournament
  if (activeRound == null) {
    activeRound = (isTournament || rounds.length > 1) ? 'total' : rounds[rounds.length - 1];
  } else if (activeRound !== 'total' && !rounds.includes(activeRound)) {
    activeRound = (isTournament || rounds.length > 1) ? 'total' : rounds[rounds.length - 1];
  }

  // Header
  qs('#hdr').style.display = '';
  qs('#hdr-title').textContent = game.course?.name || game.name || 'Leaderboard';
  const fmtType = game.format?.type ?? 'stableford';
  const fmtTee  = game.format?.tee  ?? '';
  const FORMAT_LABELS = {
    stableford: 'Stableford', stroke: 'Stroke Play', match: 'Match Play',
    betterball: 'Better Ball', split6: 'Split 6', skins: 'Skins',
    itc: 'In The Chair', foursomes: 'Foursomes', greensomes: 'Greensomes',
    texas: 'Texas Scramble', csm: 'Combined Stableford/Match',
  };
  const fmtLabel = [FORMAT_LABELS[fmtType] ?? (fmtType.charAt(0).toUpperCase() + fmtType.slice(1)), fmtTee && `${fmtTee} tees`].filter(Boolean).join(' · ');
  qs('#hdr-format').textContent = fmtLabel;
  const dateStr = (() => {
    const d = game.playedAt ?? game.createdAt;
    if (!d) return '';
    try { return new Date(d).toLocaleDateString(undefined, { day:'numeric', month:'short', year:'numeric' }); }
    catch { return ''; }
  })();
  const metaParts = [dateStr, game.organiser ? `Organised by ${game.organiser}` : ''].filter(Boolean);
  qs('#hdr-meta').textContent = metaParts.join(' · ');

  // Status bar
  const sb = qs('#status-bar');
  sb.style.display = '';
  const updAt = scores?.updatedAt;
  qs('#last-updated').textContent = fmtRelTime(updAt);
  sb.className = 'status-bar' + (updAt ? '' : ' stale');


  // Main content
  const main = qs('#main');
  const content = activeRound === 'total'
    ? renderTournamentTotal(game, scores)
    : renderLeaderboard(game, scores, activeRound);
  main.innerHTML = renderRoundTabs(rounds, activeRound, isTournament) + content;

  // Wire round tabs
  main.querySelectorAll('.round-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      const v = btn.dataset.round;
      activeRound = v === 'total' ? 'total' : Number(v);
      render();
    });
  });
}

// ── Load data ─────────────────────────────────────────────────────────────────
async function load(code) {
  qs('#main').innerHTML = `<div class="state-msg"><div class="icon" style="animation:pulse 1s infinite">⏳</div><h3>Loading…</h3></div>`;
  qs('#screen-code') && qs('#screen-code').remove();

  try {
    [gameData, scoresData] = await Promise.all([fetchGame(code), fetchScores(code)]);
    render();
    startCountdown();
  } catch (e) {
    showError('❌', 'Not found', e.message || 'Could not load this game. Check the code and try again.');
  }
}

async function refresh() {
  if (!currentCode) return;
  clearInterval(refreshTimer);
  try {
    scoresData = await fetchScores(currentCode);
    gameData   = await fetchGame(currentCode);
    qs('#last-updated').textContent = fmtRelTime(scoresData?.updatedAt);
  } catch {}
  render();
  startCountdown();
}

function startCountdown() {
  clearInterval(refreshTimer);
  countdownVal = REFRESH_SECS;
  qs('#countdown').textContent = countdownVal;
  refreshTimer = setInterval(() => {
    countdownVal--;
    const el = qs('#countdown');
    if (el) el.textContent = countdownVal;
    if (countdownVal <= 0) refresh();
  }, 1000);
}

// ── Bootstrap ─────────────────────────────────────────────────────────────────
function init() {
  const urlCode = getCodeFromURL();

  if (urlCode.length === 6) {
    currentCode = urlCode;
    load(currentCode);
  }
  // else show code entry screen (already in HTML)

  // Code input
  const inp = qs('#code-input');
  const btn = qs('#btn-go');
  if (inp) {
    inp.addEventListener('input', () => {
      const v = inp.value.replace(/[^A-Za-z0-9]/g, '').toUpperCase().slice(0,6);
      inp.value = v;
      btn.disabled = v.length !== 6;
    });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !btn.disabled) btn.click(); });
  }
  if (btn) {
    btn.addEventListener('click', () => {
      const code = inp.value.toUpperCase().slice(0,6);
      if (code.length !== 6) return;
      currentCode = code;
      setCodeInURL(code);
      load(code);
    });
  }

  // Manual refresh button
  qs('#btn-refresh')?.addEventListener('click', refresh);
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
